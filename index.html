<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
<main>

    <div >
        <div class="main">
            <h1>Sign Up </h1>
            <hr >
            <br>
            <p>Sign up to be a part of our Community.</p>
            <br>
            <div class="inputs">
                <input type="text" name="" id="iname" placeholder="Enter Name" required>
                <input type="email" name="email" id="iemail" placeholder="Enter Your Email" required >
                <input type="password" name="password" id="ipass" placeholder="Enter Your Password" required>
            </div>
            <br>
            <div class="already_acc" >
                <p>Already have an Account <a href="./signin.html">Login</a></p>
            </div>
            <br>
            <div class="signup_btn">
                <button onclick="signup()" class="btn">Sign Up</button>
            </div>
        </div>
        
        
    </div>
    
</main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./app.js"></script>
</body>

</html>
